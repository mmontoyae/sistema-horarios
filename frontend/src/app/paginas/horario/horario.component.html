<h2>Propuesta de horario</h2>

<div class="mensaje-error" *ngIf="mensajeError">{{ mensajeError }}</div>

<div class="tarjeta" *ngIf="catalogos">
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">

    <div>
      <label>Asignatura</label>
      <select [(ngModel)]="propuesta.asignatura_id">
        <option value="">-- seleccione --</option>
        <option *ngFor="let a of catalogos.asignaturas" [value]="a.asignatura_id">
          {{ a.asignatura_id }} - {{ a.nombre_asignatura }}
        </option>
      </select>
    </div>

    <div>
      <label>Paralelo</label>
      <select [(ngModel)]="propuesta.paralelo_id">
        <option value="">-- seleccione --</option>
        <option *ngFor="let p of paralelosFiltrados" [value]="p.paralelo_id">
          {{ p.paralelo_id }} ({{ p.numero_estudiantes }} est.)
        </option>
      </select>
    </div>

    <div>
      <label>Docente</label>
      <select [(ngModel)]="propuesta.docente_id">
        <option value="">-- seleccione --</option>
        <option *ngFor="let d of catalogos.docentes" [value]="d.docente_id">
          {{ d.docente_id }} - {{ d.nombres }} {{ d.apellidos }}
        </option>
      </select>
    </div>

    <div>
      <label>Espacio fisico</label>
      <select [(ngModel)]="propuesta.espacio_id">
        <option value="">-- seleccione --</option>
        <option *ngFor="let e of catalogos.espacios" [value]="e.espacio_id">
          {{ e.espacio_id }} ({{ e.tipo_espacio }}, cap. {{ e.capacidad }})
        </option>
      </select>
    </div>

    <div>
      <label>Dia</label>
      <select [(ngModel)]="propuesta.dia_semana">
        <option *ngFor="let d of dias" [value]="d">{{ d }}</option>
      </select>
    </div>

    <div>
      <label>Hora inicio</label>
      <select [(ngModel)]="propuesta.hora_inicio">
        <option *ngFor="let h of horas" [value]="h">{{ h }}</option>
      </select>
    </div>

    <div>
      <label>Hora fin</label>
      <select [(ngModel)]="propuesta.hora_fin">
        <option *ngFor="let h of horas" [value]="h">{{ h }}</option>
      </select>
    </div>

    <div>
      <label>Modalidad</label>
      <select [(ngModel)]="propuesta.modalidad">
        <option *ngFor="let m of modalidades" [value]="m">{{ m }}</option>
      </select>
    </div>
  </div>

  <div style="margin-top: 14px;">
    <label>
      <input type="checkbox" [(ngModel)]="propuesta.confirmar" style="width: auto;">
      Confirmar el bloque si la validacion es correcta (se guarda en el horario)
    </label>
  </div>

  <div style="margin-top: 14px;">
    <button (click)="validar()"
            [disabled]="enviando || !propuesta.asignatura_id || !propuesta.paralelo_id || !propuesta.docente_id || !propuesta.espacio_id">
      {{ enviando ? 'Validando...' : 'Validar propuesta' }}
    </button>
  </div>
</div>

<!-- resultado de la validacion -->
<div *ngIf="resultado">
  <div class="mensaje-ok" *ngIf="resultado.estado === 'VALIDO'">
    La propuesta es valida, no se detectaron conflictos.
  </div>

  <div class="mensaje-error" *ngIf="resultado.estado === 'INVALIDO'">
    Propuesta invalida: se detectaron {{ resultado.total_conflictos }} conflictos.
  </div>

  <div class="tarjeta" *ngIf="resultado.conflictos.length > 0">
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Detalle</th>
          <th>Bloque afectado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of resultado.conflictos">
          <td><b>{{ c.codigo }}</b></td>
          <td>{{ c.detalle }}</td>
          <td>{{ c.bloque }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
