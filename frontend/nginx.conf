server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Por defecto Nginx rechaza cualquier cuerpo mayor a 1 MB con un error 413.
    # Una carga academica completa (miles de filas de distributivo y
    # disponibilidad) supera ese limite con facilidad, asi que se amplia.
    client_max_body_size 32m;
    client_body_buffer_size 512k;

    # el frontend y la API comparten dominio, asi no hace falta configurar CORS
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # las cargas grandes tardan mas que una peticion normal
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # el enrutador de Angular maneja las rutas del lado del navegador
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
